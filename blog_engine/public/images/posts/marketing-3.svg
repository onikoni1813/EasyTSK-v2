<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4c0519"/>
            <stop offset="100%" stop-color="#1c1917"/>
        </linearGradient>
        <linearGradient id="gradAccent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#fda4af" stop-opacity="0.0"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="80%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bgGrad)"/>
    <circle cx="950" cy="250" r="350" fill="url(#glowGrad)"/>

    <!-- Decorative Pattern -->
    
            <defs>
                <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.15"/>
                </pattern>
            </defs>
            <rect x="650" y="50" width="500" height="500" fill="url(#gridPattern)"/>
            <rect x="750" y="120" width="120" height="120" rx="20" fill="#f43f5e" opacity="0.12" stroke="#f43f5e" stroke-width="2"/>
            <rect x="920" y="240" width="140" height="140" rx="24" fill="#fda4af" opacity="0.15" stroke="#fda4af" stroke-width="2"/>
            

    <!-- Glass Icon Container -->
    <g transform="translate(900, 220)">
        <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#1c1917" fill-opacity="0.7" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#fda4af" text-anchor="middle" letter-spacing="1">SEO</text>
    </g>

    <!-- Left Content -->
    <g transform="translate(80, 160)">
        <!-- Category Badge -->
        <rect x="0" y="0" width="240" height="38" rx="19" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="120" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fda4af" text-anchor="middle" letter-spacing="2">SEO STRATEGIES</text>

        <!-- Main Title -->
        <text x="0" y="100" font-family="Georgia, Cambria, serif" font-size="44" font-weight="bold" fill="#ffffff">
            <tspan x="0" dy="0">E-E-A-T Modern SEO Tactics</tspan>
        </text>

        <!-- Subtitle / Meta -->
        <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
            Expert Analysis &#8226; 2026 Strategic Blueprint &#8226; Verified Publication
        </text>

        <!-- Decorative bar -->
        <rect x="0" y="220" width="80" height="5" rx="2.5" fill="#f43f5e"/>
    </g>
</svg>